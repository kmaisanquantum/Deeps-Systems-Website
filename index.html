<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Deeps Systems: Born-in-the-Cloud (BITC) optimization for PNG SMEs, finance, and logistics. High-performance digital outcomes." />
    <title>Deeps Systems | Digital Transformation & Optimization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #ffffff;
        --text-main: #111827;
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(0, 0, 0, 0.08);
        --card-glow: rgba(5, 150, 105, 0.02);
        --accent-primary: #059669;
        --accent-secondary: #2563eb;
        --accent-gold: #d97706;
      }

      .dark {
        --bg-main: #0a0a0a;
        --text-main: #f8fafc;
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.1);
        --card-glow: rgba(5, 150, 105, 0.05);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
      }

      .font-montserrat {
        font-family: 'Montserrat', sans-serif;
      }

      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        transition: border-color 0.5s ease, box-shadow 0.5s ease, transform 0.5s ease, background 0.5s ease;
      }
      
      @keyframes target-pulse {
        0%, 100% { border-color: rgba(5, 150, 105, 0.2); box-shadow: 0 0 20px rgba(0, 0, 0, 0); }
        50% { border-color: rgba(5, 150, 105, 0.8); box-shadow: 0 0 40px rgba(5, 150, 105, 0.2); transform: scale(1.005); }
      }

      section:target, div:target {
        animation: target-pulse 2s ease-in-out 1.5;
        outline: none;
      }

      .quantum-gradient {
        background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
      }
      .quantum-text-gradient {
        background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      @keyframes quantum-drift-up {
        0% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(20px, -100px) rotate(180deg); }
        100% { transform: translate(0, -200px) rotate(360deg); }
      }
      
      @keyframes quantum-drift-wide {
        0% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(80px, 30px) rotate(120deg); }
        66% { transform: translate(-40px, 60px) rotate(240deg); }
        100% { transform: translate(0, 0) rotate(360deg); }
      }
      
      @keyframes quantum-pulse {
        0%, 100% { opacity: 0.1; transform: scale(0.8); }
        50% { opacity: 0.35; transform: scale(1.15); }
      }

      .quantum-particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        will-change: transform, opacity;
        mix-blend-mode: multiply;
        opacity: 0.05 !important;
      }

      .dark .quantum-particle {
        mix-blend-mode: screen;
        opacity: 0.1 !important;
      }

      /* ENHANCED WORD REVEAL ANIMATION */
      @keyframes word-reveal-quantum {
        0% { 
          opacity: 0; 
          transform: translateY(40px) scale(0.9) rotateX(-45deg); 
          filter: blur(20px) brightness(1.8);
          letter-spacing: 0.2em;
        }
        100% { 
          opacity: 1; 
          transform: translateY(0) scale(1) rotateX(0deg); 
          filter: blur(0) brightness(1);
          letter-spacing: normal;
        }
      }

      .animate-word {
        display: inline-block;
        opacity: 0;
        transform-origin: center bottom;
        animation: word-reveal-quantum 1.1s cubic-bezier(0.05, 0.7, 0.1, 1.0) forwards;
      }

      @keyframes reveal-fade-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .reveal-on-scroll {
        opacity: 0;
        will-change: transform, opacity;
      }

      .reveal-active {
        animation: reveal-fade-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* SECTOR ICON ANIMATIONS */
      @keyframes icon-pulse-quantum {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(5, 150, 105, 0)); }
        50% { transform: scale(1.12); filter: drop-shadow(0 0 10px rgba(5, 150, 105, 0.6)); }
      }
      @keyframes icon-float-quantum {
        0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 2px rgba(5, 150, 105, 0.2)); }
        50% { transform: translateY(-12px); filter: drop-shadow(0 0 15px rgba(5, 150, 105, 0.5)); }
      }

      .animate-icon-pulse { will-change: transform, filter; }
      .animate-icon-float { will-change: transform, filter; }

      .reveal-active .animate-icon-pulse { animation: icon-pulse-quantum 3s ease-in-out infinite; transform-origin: center; }
      .reveal-active .animate-icon-float { animation: icon-float-quantum 4s ease-in-out infinite; transform-origin: center; }

      /* BUTTON ARROW ANIMATION */
      @keyframes arrow-scroll-down {
        0% { transform: translateY(-4px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(4px); opacity: 0; }
      }
      .group-hover\/btn .animate-arrow-down {
        animation: arrow-scroll-down 1s ease-in-out infinite;
      }

      /* HEADLINE GLOW */
      @keyframes headline-glow {
        0%, 100% { 
          filter: drop-shadow(0 0 0px rgba(5, 150, 105, 0));
          text-shadow: 0 0 8px rgba(5, 150, 105, 0.05);
        }
        50% { 
          filter: drop-shadow(0 0 15px rgba(5, 150, 105, 0.15));
          text-shadow: 0 0 12px rgba(5, 150, 105, 0.2);
        }
      }
      .headline-glow-active { animation: headline-glow 5s ease-in-out infinite; }

      /* CTA STYLES */
      @keyframes btn-pulse-breathing {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.015); }
      }

      @keyframes btn-shine {
        from { transform: translateX(-100%) skewX(-45deg); }
        to { transform: translateX(200%) skewX(-45deg); }
      }

      .btn-cta-pulse {
        transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        will-change: transform, box-shadow, filter;
        animation: btn-pulse-breathing 4s ease-in-out infinite;
        position: relative;
        z-index: 1;
        overflow: hidden;
        box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.1);
      }

      .btn-cta-pulse::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transform: translateX(-100%) skewX(-45deg);
        z-index: -1;
      }

      .btn-cta-pulse:hover::after {
        animation: btn-shine 1s ease-out forwards;
      }

      .btn-cta-pulse:hover {
        box-shadow: 
          0 0 40px rgba(5, 150, 105, 0.4),
          0 20px 40px -15px rgba(0, 0, 0, 0.2);
        filter: brightness(1.1);
        transform: translateY(-2px);
      }

      .btn-secondary-cta {
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        will-change: transform, box-shadow;
        position: relative;
        overflow: hidden;
      }
      
      .btn-secondary-cta:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
        background: rgba(0, 0, 0, 0.02);
      }

      /* Snappy active state */
      .active-click:active {
        transform: scale(0.95) translateY(2px) !important;
        transition: transform 0.08s cubic-bezier(0.1, 0.7, 0.1, 1);
      }
      
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-main); }
      ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(5, 150, 105, 0.4); }

      .dark ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }

      /* Dark Mode Overrides for Hardcoded Backgrounds */
      .dark .bg-white\/2 { background-color: rgba(255, 255, 255, 0.02) !important; }
      .dark .border-white\/5, .dark .border-white\/10 { border-color: rgba(255, 255, 255, 0.1) !important; }
      
      .dark .glass {
        background: rgba(255, 255, 255, 0.03) !important;
        border-color: rgba(255, 255, 255, 0.1);
      }

      ::selection {
        background: rgba(5, 150, 105, 0.3);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const observerOptions = {
          threshold: 0.1,
          rootMargin: '0px 0px -5% 0px'
        };

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('reveal-active');
              observer.unobserve(entry.target);
            }
          });
        }, observerOptions);

        const observeNewElements = () => {
          const revealElements = document.querySelectorAll('.reveal-on-scroll:not(.reveal-active)');
          revealElements.forEach(el => observer.observe(el));
        };

        const mutationObserver = new MutationObserver(observeNewElements);
        mutationObserver.observe(document.body, { childList: true, subtree: true });

        observeNewElements();
      });
    </script>
  </body>
</html>
